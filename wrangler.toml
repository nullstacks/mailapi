name = "mailapi"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Created 2026-10-07 — dedicated namespace for this worker (isolated from the old gmail-api worker's data)
[[kv_namespaces]]
binding = "KV"
id = "98a6fd4dcd5444d7a7d4e340dc190ddf"

# Optional: override scopes (space separated)
# [vars]
# SCOPES = "openid email https://www.googleapis.com/auth/gmail.readonly"

# Secrets (set with `npx wrangler secret put NAME`):
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   ENCRYPTION_KEY   (any long random string; encrypts refresh tokens in KV)
